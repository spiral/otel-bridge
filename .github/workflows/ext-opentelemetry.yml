on:
  pull_request: null
  push:
    branches:
      - 2.x

name: ext-opentelemetry

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ext-opentelemetry:
    name: ext-opentelemetry, ${{ matrix.instrumentation }}, PHP ${{ matrix.php }}, ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        dependencies: ['lowest', 'highest']
        # none: every test with the extension alone; psr: the auto-instrumentation tests with psr15 and psr18.
        instrumentation: ['none', 'psr']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opentelemetry, sockets
          coverage: none
          ini-values: memory_limit=-1

      # Hooks are registered from the Composer autoloader and cannot be removed, so the instrumentation is
      # installed only for its own tests: with it, every Spiral HTTP test would get its spans.
      - name: Add auto-instrumentation
        if: matrix.instrumentation == 'psr'
        run: >-
          composer require --dev --no-update --no-interaction
          open-telemetry/opentelemetry-auto-psr15:^1.0.6 open-telemetry/opentelemetry-auto-psr18:^1.1

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Check the extension
        run: php --ri opentelemetry

      - name: Execute Tests
        if: matrix.instrumentation == 'none'
        run: vendor/bin/testo

      - name: Execute Auto-instrumentation Tests
        if: matrix.instrumentation == 'psr'
        run: vendor/bin/testo --path=tests/Acceptance/AutoInstrumentationTest.php
        env:
          REQUIRE_EXT: '1'
