on:
  pull_request: null
  push:
    branches:
      - master

name: testo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    uses: spiral/gh-actions/.github/workflows/testo.yml@master
    with:
      os: >-
        ['ubuntu-latest']
      php: >-
        ['8.2', '8.3', '8.4', '8.5', '8.6']
      dependencies: >-
        ['lowest', 'highest']
